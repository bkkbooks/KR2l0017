  text: 欽定四庫全書史部十二
  hash: sha256:683b84fba18cbfaf1b4f7fb7adb0cf04b078729870de9e8d06bf823f11967f61
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2l0017_WYG_000-1a, image: WYG0602/WYG0602-0651a.png}
body:
  text: 官箴職官類二官箴之屬提要臣等謹案官箴一卷宋吕本中撰本中有春秋集解已著録此乃其所著居官格言凡三十三則宋史本中列傳備列其著作之目不載是書然藝文志雜家類中乃著録一卷此本載左圭百川學海中後有寳慶丁亥永嘉陳昉跋葢即昉所刋行或當日偶然題記如歐陽修試筆之類本非有意於著書後人得其手稿傳寫鐫刻始加標目故本傳不載歟本中以工詩名家然所作童䝉訓於修已治人之道具有條理葢亦留心經世者故此書多閲厯有得之言可以見諸實事書首即掲清慎勤三字以為當官之法其言千古不可易王士禎古夫于亭雜録曰上嘗御書清慎勤三大字刻石賜内外諸臣案此三字吕本中官箴中語也是數百年後尚䝉聖天子採擇其説訓示百官則所言中理可知矣至其論不欺之道明白深切亦足以資儆戒雖篇帙無多而詞簡義精固有官者之龜鑑也乾隆四十五年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:5d31b37a329c47b90371297a9887baab13866e348a54f49a425390debe3b9978
